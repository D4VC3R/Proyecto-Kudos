services:
  kudos-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./:/app
      - frontend-node_modules:/app/node_modules
      - pnpm-store:/pnpm/store
    ports:
      - "5174:5174"
      - "4174:4174"

volumes:
  frontend-node_modules:
  pnpm-store: