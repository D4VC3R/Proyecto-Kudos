services:
  kudos-frontend:
    image: node:25
    working_dir: /app
    volumes:
      - ./:/app
      - frontend-node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8095/api}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"

volumes:
  frontend-node_modules:
