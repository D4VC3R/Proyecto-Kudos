# Nginx DEL HOST para la API de Kudos. Copia versionada de:
#   /etc/nginx/sites-available/api.kudos.dcerdan.es
# (el repositorio no la instala: se copia a mano; ver deploy/README.md).
#
# Proxy inverso hacia el Nginx interno de Docker, publicado solo en 127.0.0.1:8001.
# Este fichero solo define el puerto 80: "certbot --nginx" añade después el bloque 443
# y la redirección de HTTP a HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name api.kudos.dcerdan.es;

    include snippets/security-headers.conf;
    include snippets/deny-hidden.conf;

    # Por defecto Nginx corta en 1 MB (413). Igual que el Nginx interno y post_max_size de PHP.
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Este Nginx es la puerta de entrada (no hay CDN delante): se SOBRESCRIBEN las cabeceras
        # X-Forwarded-* en vez de añadir a las que mande el cliente, para que nadie pueda falsear
        # su IP (el throttle del login va por IP) ni el host o el puerto con los que Laravel genera URLs.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
