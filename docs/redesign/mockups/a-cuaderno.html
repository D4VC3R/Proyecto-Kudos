<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta A · Cuaderno</title>
<script src="shared/data.js?v=2"></script>
<script src="shared/mockup.js?v=2"></script>
<style>
/* Fuentes autoalojadas (OFL). Fraunces con eje de tamaño óptico: grande en titulares, sobria en pequeño. */
@font-face { font-family: 'Fraunces'; src: url('fonts/fraunces-latin-opsz-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

/* Tokens de la dirección A (docs/redesign/direcciones.md). Solo estos colores. */
:root {
  --canvas: #FAF7F2; --surface: #FFFFFF; --ink: #1C1917; --ink-muted: #57534E;
  --accent: #B93815; --on-accent: #FFFFFF; --success: #166534;
  --line: #E7E1D8; --line-strong: #8A8178; --kudos: #F2B33D; --on-kudos: #1C1917;
  --font-display: 'Fraunces', Georgia, serif; --font-body: 'Inter', system-ui, sans-serif;
  --r-card: 8px; --r-field: 6px; --header-h: 64px; --gutter: 16px; --max: 1200px;
  color-scheme: light;
}
html.dark {
  --canvas: #16130F; --surface: #211D19; --ink: #F3EEE7; --ink-muted: #ACA39A;
  --accent: #EE8A66; --on-accent: #1C1917; --success: #6CC58A;
  --line: #332D27; --line-strong: #7A7067;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 400 16px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
img { display: block; max-width: 100%; height: auto; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.serif { font-family: var(--font-display); font-optical-sizing: auto; }
.num { font-variant-numeric: tabular-nums; }
.i { flex: none; }

/* Foco: anillo de 2 px separado, distinto del subrayado de la navegación activa. */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.skip { position: absolute; left: 16px; top: -60px; z-index: 100; background: var(--ink); color: var(--canvas); padding: 10px 14px; border-radius: var(--r-field); font-weight: 600; text-decoration: none; }
.skip:focus { top: 12px; }

.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
.kicker { font: 600 12px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.link { color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; white-space: nowrap; }
.link:hover { text-decoration-thickness: 2px; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--r-field); border: 1px solid transparent; font: 600 15px/1.2 var(--font-body); text-decoration: none; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn-secondary:hover { border-color: var(--ink); }
.btn-ghost { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: color-mix(in srgb, var(--line) 60%, transparent); }
.btn-lg { min-height: 56px; font-size: 17px; }
.btn[aria-pressed="true"] { border-color: var(--ink); background: color-mix(in srgb, var(--line) 50%, var(--surface)); }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--r-field); border: 1px solid transparent; background: transparent; color: var(--ink); cursor: pointer; position: relative; transition: border-color .15s; }
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn:disabled { color: var(--line-strong); cursor: default; border-color: transparent; }
.icon-btn.sm { width: 32px; height: 32px; color: var(--ink-muted); }
kbd { font: 600 12px/1 var(--font-body); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; }

/* Kudos: el único dorado de la página */
.kudos-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--kudos); color: var(--on-kudos); font: 700 13px/1 var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
.kudos-badge.lg { font-size: 15px; padding: 6px 12px 6px 9px; }

/* Cabecera */
.site-header { position: sticky; top: 0; z-index: 50; background: var(--canvas); border-bottom: 1px solid var(--line); }
.header-inner { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); height: var(--header-h); display: flex; align-items: center; gap: 4px; }
.logo { display: inline-flex; align-items: center; gap: 8px; color: var(--ink); text-decoration: none; font: 600 22px/1 var(--font-display); letter-spacing: -.015em; padding: 4px 2px; }
.nav-desktop { display: none; }
.nav-desktop a { padding: 8px 10px; color: var(--ink-muted); text-decoration: none; font-weight: 500; font-size: 15px; border-radius: 4px; }
.nav-desktop a:hover { color: var(--ink); }
.nav-desktop a[aria-current="page"], .nav-mobile a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 8px; }
.spacer { flex: 1; }
.search { display: none; position: relative; }
.search .i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); pointer-events: none; }
.search input, .field { width: 100%; height: 40px; padding: 0 12px 0 36px; border: 1px solid var(--line-strong); border-radius: var(--r-field); background: var(--surface); }
.search input::placeholder, .field::placeholder, textarea::placeholder { color: var(--ink-muted); }
.theme-btn { display: none; }
.bell-dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); border: 2px solid var(--canvas); }
.user { position: relative; }
.user-pill { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 8px 0 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; }
.user-pill:hover { border-color: var(--line-strong); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: none; place-items: center; background: var(--ink); color: var(--canvas); font: 600 14px/1 var(--font-display); }
.user-name { display: none; font-weight: 600; font-size: 14px; }
.rank { font: 600 13px/1 var(--font-body); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.popover { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 6px; box-shadow: 0 16px 32px -16px color-mix(in srgb, var(--ink) 35%, transparent); }
.popover a, .popover button.menu-item { display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px; border-radius: 4px; text-decoration: none; font-size: 15px; background: none; border: 0; cursor: pointer; text-align: left; }
.popover a:hover, .popover button.menu-item:hover { background: color-mix(in srgb, var(--line) 55%, transparent); }
.popover hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
.popover .who { padding: 10px; display: grid; gap: 6px; }
.nav-mobile { position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); padding: 16px var(--gutter) 20px; display: grid; gap: 4px; }
.nav-mobile a, .nav-mobile button.menu-item { display: flex; align-items: center; min-height: 48px; padding: 0 4px; text-decoration: none; font-size: 17px; font-weight: 500; border: 0; border-bottom: 1px solid var(--line); background: none; cursor: pointer; text-align: left; gap: 10px; }
.nav-mobile .search { display: block; margin-bottom: 8px; }

/* Portada */
.hero { padding: 40px 0 8px; }
.display { font-family: var(--font-display); font-optical-sizing: auto; font-weight: 600; font-size: clamp(2.25rem, 6vw, 4.25rem); line-height: 1.02; letter-spacing: -.025em; margin: 10px 0 14px; max-width: 15ch; }
.lede { font-size: clamp(1.0625rem, 2vw, 1.25rem); color: var(--ink-muted); max-width: 56ch; line-height: 1.5; }
.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 28px; }
.cat { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); text-decoration: none; font-weight: 600; transition: border-color .15s; }
.cat:hover { border-color: var(--ink); }
.cat .i { color: var(--ink-muted); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 1px solid var(--ink); padding-top: 12px; margin: 48px 0 16px; }
.sec-head h2 { font-family: var(--font-display); font-optical-sizing: auto; font-weight: 600; font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -.015em; line-height: 1.1; }
.sec-tools { display: flex; align-items: center; gap: 8px; }
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
.row-head h3 { font-size: 17px; font-weight: 600; }
.row-head h3 .serif { font-weight: 600; font-size: 19px; }
.arrows { display: none; gap: 4px; }
.row { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 24px) / 2.3); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 calc(var(--gutter) * -1); padding: 2px var(--gutter) 10px; scroll-padding: 0 var(--gutter); scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
.card { scroll-snap-align: start; min-width: 0; }
.card-link { display: block; text-decoration: none; border-radius: var(--r-card); }
.poster { display: block; aspect-ratio: 2 / 3; border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.poster img { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
.card-link:hover .poster img { transform: scale(1.03); }
.card-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 10px 0 4px; font-weight: 600; font-size: 15px; line-height: 1.3; }
.card-link:hover .card-title { text-decoration: underline; text-underline-offset: 3px; }
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--ink-muted); }
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; color: var(--ink-muted); white-space: nowrap; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.stamp-sm { display: inline-block; padding: 4px 7px; border: 1px solid var(--ink); border-radius: 4px; font: 600 15px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stamp-sm.empty { border-color: var(--line-strong); color: var(--ink-muted); font: 500 12px/1 var(--font-body); padding: 5px 7px; }
.ranking { margin-top: 56px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--line); padding: 20px 0 24px; display: grid; gap: 24px; }
.ranking h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(1.75rem, 4vw, 2.5rem); line-height: 1.05; letter-spacing: -.02em; margin: 8px 0 10px; }
.ranking p { color: var(--ink-muted); max-width: 44ch; }
.ranking-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
.podium { list-style: none; margin: 0; padding: 0; }
.podium li { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.podium li:first-child { border-top: 0; }
.pos { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--ink); font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.p1 .pos { width: 64px; height: 64px; font-size: 30px; background: var(--kudos); color: var(--on-kudos); border-color: var(--on-kudos); }
.p-name { font: 600 18px/1.2 var(--font-display); }
.p1 .p-name { font-size: 26px; }
.me { background: color-mix(in srgb, var(--line) 40%, transparent); padding-inline: 10px !important; border-radius: var(--r-card); }
.me-tag { font: 600 12px var(--font-body); color: var(--ink-muted); margin-left: 6px; }
.lists { display: grid; gap: 16px; }
.list-card { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); text-decoration: none; transition: border-color .15s; }
.list-card:hover { border-color: var(--ink); }
.collage { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.collage img { aspect-ratio: 2 / 3; width: 100%; object-fit: cover; border-radius: 4px; border: 1px solid var(--line); }
.list-title { font: 600 21px/1.15 var(--font-display); letter-spacing: -.01em; }
.list-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; color: var(--ink-muted); }

/* Ficha */
.crumbs { padding-top: 20px; font-size: 14px; color: var(--ink-muted); }
.crumbs a { color: var(--ink-muted); }
.crumbs a:hover { color: var(--ink); }
.detail { display: grid; gap: 24px; padding-top: 20px; }
.detail-poster { width: 100%; max-width: 260px; margin: 0 auto; }
.detail-poster img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--r-card); border: 1px solid var(--line); }
.detail-poster figcaption { margin-top: 8px; font-size: 12px; color: var(--ink-muted); }
.detail-title { font-family: var(--font-display); font-optical-sizing: auto; font-weight: 600; font-size: clamp(2rem, 4.5vw, 3.25rem); line-height: 1.04; letter-spacing: -.02em; margin: 8px 0 6px; }
.original { color: var(--ink-muted); font-size: 15px; }
.original i { font-family: var(--font-display); font-style: normal; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts dt { font: 600 12px/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); }
.facts dd { margin: 4px 0 0; font-size: 15px; }
.score-block { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; margin: 24px 0; }
.stamp-lg { position: relative; width: 108px; height: 108px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-content: center; text-align: center; transform: rotate(-4deg); }
.stamp-lg::after { content: ''; position: absolute; inset: 5px; border: 1px solid var(--ink); border-radius: 50%; }
.stamp-lg b { font: 600 36px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.stamp-lg span { font-size: 12px; color: var(--ink-muted); }
.dist-head { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
.dist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.dist li { display: grid; grid-template-columns: 82px minmax(0, 1fr) 20px; gap: 8px; align-items: center; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-muted); }
.dist .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.prose p { font-size: 17px; line-height: 1.65; max-width: 65ch; margin-bottom: 14px; }
.source { font-size: 13px; color: var(--ink-muted); }
.comment-form { display: grid; gap: 8px; margin-bottom: 8px; }
.comment-form label { font-weight: 600; font-size: 15px; }
textarea { width: 100%; min-height: 96px; padding: 12px; border: 1px solid var(--line-strong); border-radius: var(--r-field); background: var(--surface); resize: vertical; line-height: 1.5; }
.form-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-muted); }
.comments { list-style: none; margin: 0; padding: 0; }
.comments li { padding: 16px 0; border-top: 1px solid var(--line); }
.c-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.c-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--line); font: 600 15px/1 var(--font-display); }
.c-user { font-weight: 600; font-size: 15px; }
.c-when { font-size: 13px; color: var(--ink-muted); }
.c-head .stamp-sm { margin-left: auto; }
.comments p { font-size: 15px; line-height: 1.6; max-width: 65ch; }
.credit { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-muted); }

/* Votar */
.vote-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 20px 0 16px; border-bottom: 1px solid var(--line); }
.progress { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-top: 4px; }
.track { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--ink); transition: width .3s; }
.earn { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-muted); }
.vote { display: grid; gap: 24px; padding: 24px 0 8px; }
.vote-poster { width: 100%; max-width: 220px; margin: 0 auto; }
.vote-poster img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: var(--r-card); border: 1px solid var(--line); }
.vote-title { font-family: var(--font-display); font-optical-sizing: auto; font-weight: 600; font-size: clamp(1.875rem, 4vw, 3rem); line-height: 1.05; letter-spacing: -.02em; margin: 8px 0 12px; }
.synopsis { color: var(--ink-muted); max-width: 60ch; line-height: 1.6; }
.question { margin-top: 24px; padding: 20px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); }
.q { font: 600 24px/1.15 var(--font-display); margin-bottom: 16px; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.levels { display: flex; flex-direction: column-reverse; gap: 8px; }
.level { justify-content: space-between; min-height: 52px; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; }
.dots i.on { background: currentColor; }
.level-label { flex: 1; text-align: left; margin-left: 6px; }
.back { margin-top: 12px; }
.hint { margin-top: 12px; font-size: 13px; color: var(--ink-muted); }
.done { display: flex; align-items: center; gap: 14px; min-height: 112px; }
.done-ico { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--success); color: var(--success); flex: none; }
.done .q { margin: 0 0 6px; }
.done .kudos-badge { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
.vote-links { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 16px; }

/* Pie */
.site-footer { margin-top: 72px; border-top: 1px solid var(--line); }
.footer-grid { display: grid; gap: 20px; padding: 32px 0 24px; }
.f-brand { font: 600 22px/1 var(--font-display); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.f-muted { color: var(--ink-muted); font-size: 14px; }
.f-links { display: flex; gap: 14px; margin-top: 8px; font-size: 14px; }
.f-links a { text-underline-offset: 3px; }
.f-school { font-size: 14px; }
.f-school b { display: block; font-weight: 600; }
.f-gh { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; text-decoration: none; }
.f-gh:hover { text-decoration: underline; }
.attrib { border-top: 1px solid var(--line); padding: 20px 0 88px; display: grid; gap: 10px; font-size: 13px; color: var(--ink-muted); }
.attrib-row { display: grid; gap: 10px; align-items: center; }
.tmdb-mark { justify-self: start; font: 800 14px/1 var(--font-body); letter-spacing: .14em; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 4px 8px; }

@media (min-width: 640px) {
  .attrib-row { grid-template-columns: auto 1fr; gap: 16px; }
}
@media (min-width: 768px) {
  :root { --gutter: 24px; }
  .header-inner { gap: 6px; }
  .logo { font-size: 24px; }
  .search { display: block; width: 220px; }
  .theme-btn { display: inline-grid; }
  .avatar { display: grid; }
  .cats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .arrows { display: flex; }
  .row { grid-auto-columns: calc((100% - 3 * 16px) / 4.3); gap: 16px; }
  .ranking { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 40px; align-items: center; }
  .lists { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .vote { grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 40px; align-items: start; }
  .vote-poster { max-width: none; }
  .footer-grid { grid-template-columns: 1fr auto 1fr; align-items: start; }
  .footer-grid > :last-child { justify-self: end; }
  .f-school { text-align: center; }
}
@media (min-width: 1024px) {
  .menu-btn { display: none; }
  .nav-desktop { display: flex; gap: 2px; margin-left: 20px; }
  .nav-mobile { display: none !important; }
  .row { margin: 0; padding: 2px 0 10px; scroll-padding: 0; grid-auto-columns: calc((100% - 5 * 16px) / 6); }
  .detail { grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 56px; align-items: start; }
  .detail-poster { max-width: none; position: sticky; top: calc(var(--header-h) + 24px); }
  .vote { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 56px; }
  .levels { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .level { flex-direction: column; justify-content: center; gap: 8px; min-height: 104px; padding: 12px 8px; }
  .level-label { flex: none; text-align: center; margin: 0; }
}
@media (min-width: 1280px) {
  .search { width: 280px; }
  .user-name { display: inline; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="site-header">
  <div class="header-inner">
    <button class="icon-btn menu-btn" id="menu-btn" aria-expanded="false" aria-controls="nav-mobile" aria-label="Abrir menú"></button>
    <a class="logo" href="#" data-go="home" aria-label="Kudos, ir a la portada"></a>
    <nav class="nav-desktop" id="nav-desktop" aria-label="Principal"></nav>
    <div class="spacer"></div>
    <form class="search" role="search" onsubmit="return false">
      <label class="sr-only" for="q">Buscar en Kudos</label>
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Buscar en Kudos…">
    </form>
    <button class="icon-btn theme-btn" data-theme-toggle></button>
    <button class="icon-btn" id="bell" aria-label="Notificaciones: 2 sin leer"><span data-icon="bell"></span><span class="bell-dot"></span></button>
    <div class="user">
      <button class="user-pill" id="user-btn" aria-expanded="false" aria-controls="user-menu"></button>
      <div class="popover" id="user-menu" hidden></div>
    </div>
  </div>
  <div class="nav-mobile" id="nav-mobile" hidden></div>
</header>

<div id="contenido" tabindex="-1">
  <main data-screen="home"></main>
  <main data-screen="ficha" hidden></main>
  <main data-screen="votar" hidden></main>
</div>

<footer class="site-footer" id="footer"></footer>

<script>
(function () {
  const K = window.KUDOS;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  // --- Iconos (trazo simple, 24 × 24) ---
  const P = {
    search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    chevL: '<path d="m15 18-6-6 6-6"/>',
    chevR: '<path d="m9 18 6-6-6-6"/>',
    listPlus: '<path d="M11 12H3M16 6H3M16 18H3M18 9v6M21 12h-6"/>',
    bookmark: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    arrowL: '<path d="m12 19-7-7 7-7M19 12H5"/>',
    github: '<path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
    chart: '<path d="M3 3v18h18M7 16v-4M12 16V8M17 16v-7"/>',
    film: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"/>',
    tv: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
    gamepad: '<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><rect x="2" y="6" width="20" height="12" rx="4"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/>',
    message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
    eyeOff: '<path d="M9.9 4.2A10 10 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7M6.6 6.6A13 13 0 0 0 2 12s3 8 10 8a10 10 0 0 0 5.4-1.6M2 2l20 20M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  };
  const icon = (n, s = 20) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
  const star = (s = 14) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>`;
  // Estrella del logotipo: un sello de doble filete con la estrella dorada dentro.
  const logoMark = (s = 30) => `<svg width="${s}" height="${s}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.75" fill="none" stroke="currentColor" stroke-width="1.25"/><circle cx="16" cy="16" r="12.25" fill="none" stroke="currentColor" stroke-width=".75"/><path d="M16 7.2l2.5 5.1 5.6.8-4.05 3.95.95 5.55L16 19.95l-5 2.65.95-5.55-4.05-3.95 5.6-.8z" style="fill:var(--kudos)" stroke="currentColor" stroke-width="1" stroke-linejoin="round"/></svg>`;
  const catIcon = { peliculas: 'film', series: 'tv', videojuegos: 'gamepad', destinos: 'pin' };
  const kudos = (label, lg) => `<span class="kudos-badge${lg ? ' lg' : ''}">${star(lg ? 16 : 14)}<span>${esc(label)}</span><span class="sr-only"> kudos</span></span>`;
  const stampSm = (it) => (K.score(it.avg)
    ? `<span class="stamp-sm" aria-label="Nota ${K.score(it.avg)} de 10">${K.score(it.avg)}</span>`
    : '<span class="stamp-sm empty">Sin nota</span>');

  document.querySelectorAll('[data-icon]').forEach((el) => { el.outerHTML = icon(el.dataset.icon, 18); });

  // --- Cabecera ---
  $('.logo').innerHTML = `${logoMark()}<span>${esc(K.footer.brand)}</span>`;
  const navLinks = (withAdmin) => K.nav.filter((n) => withAdmin || n.key !== 'admin')
    .map((n) => `<a href="#" ${n.key === 'categorias' ? 'data-go="home" data-nav-home' : ''}>${esc(n.label)}</a>`).join('');
  // En escritorio, «Administración» va al menú de usuario para que la navegación quepa con texto.
  $('#nav-desktop').innerHTML = navLinks(false);
  $('#nav-mobile').innerHTML = `
    <form class="search" role="search" onsubmit="return false"><label class="sr-only" for="q-m">Buscar en Kudos</label>${icon('search', 18)}<input id="q-m" type="search" placeholder="Buscar en Kudos…"></form>
    <nav aria-label="Principal (móvil)" style="display:grid">${navLinks(true)}</nav>
    <button class="menu-item" data-theme-toggle><span data-theme-icon></span><span data-theme-label></span></button>
    <button class="menu-item">${icon('logout', 18)} Cerrar sesión</button>`;
  $('#user-btn').innerHTML = `<span class="avatar">K</span><span class="user-name">${esc(K.user.name)}</span>${kudos(K.user.kudosLabel)}<span class="rank" aria-label="Posición ${K.user.rank} del ranking">#${K.user.rank}</span>`;
  $('#user-btn').setAttribute('aria-label', `${K.user.name}: ${K.user.kudosLabel} kudos, posición ${K.user.rank}. Abrir menú de usuario`);
  $('#user-menu').innerHTML = `
    <div class="who"><b>${esc(K.user.name)}</b><span>${kudos(K.user.kudosLabel)} <span class="rank">#${K.user.rank} del ranking</span></span></div><hr>
    <a href="#">${icon('user', 18)} Mi perfil</a><a href="#">${icon('chart', 18)} Mis estadísticas</a><a href="#">${icon('shield', 18)} Administración</a><hr>
    <button class="menu-item">${icon('logout', 18)} Cerrar sesión</button>`;

  function syncTheme() {
    const dark = document.documentElement.classList.contains('dark');
    document.querySelectorAll('.theme-btn').forEach((b) => { b.innerHTML = icon(dark ? 'sun' : 'moon'); b.setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'); });
    document.querySelectorAll('[data-theme-icon]').forEach((s) => { s.innerHTML = icon(dark ? 'sun' : 'moon', 18); });
    document.querySelectorAll('[data-theme-label]').forEach((s) => { s.textContent = dark ? 'Modo claro' : 'Modo oscuro'; });
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  syncTheme();

  // Paneles desplegables: uno abierto a la vez; se cierran con Escape o al pulsar fuera.
  let open = null;
  function setOpen(d, state) {
    if (open && open !== d) setOpen(open, false);
    d.btn.setAttribute('aria-expanded', String(state));
    d.panel.hidden = !state;
    d.onToggle?.(state);
    open = state ? d : null;
  }
  function disclosure(btn, panel, onToggle) {
    const d = { btn, panel, onToggle };
    btn.addEventListener('click', (e) => { e.stopPropagation(); setOpen(d, d.panel.hidden); });
    return d;
  }
  const menuBtn = $('#menu-btn');
  const menuIcon = (o) => { menuBtn.innerHTML = icon(o ? 'x' : 'menu'); menuBtn.setAttribute('aria-label', o ? 'Cerrar menú' : 'Abrir menú'); };
  menuIcon(false);
  disclosure(menuBtn, $('#nav-mobile'), menuIcon);
  disclosure($('#user-btn'), $('#user-menu'));
  document.addEventListener('click', (e) => {
    if (open && !open.panel.contains(e.target) && !open.btn.contains(e.target)) setOpen(open, false);
    if (open && e.target.closest('[data-go]')) setOpen(open, false);
    const a = e.target.closest('a[href="#"]');
    if (a) e.preventDefault();
  });

  // --- Piezas ---
  const meta = (it) => {
    const c = K.categories[it.cat];
    const first = it.year ?? it.genres[0];
    const chip = it.year ? it.genres[0] : it.genres[1];
    return `<div class="card-meta"><span title="${c.short}">${icon(catIcon[it.cat], 14)}</span><span class="sr-only">${c.short}, </span><span class="num">${esc(first)}</span>${chip ? `<span class="chip">${esc(chip)}</span>` : ''}</div>`;
  };
  const card = (it) => `<article class="card">
      <a class="card-link" href="#" data-go="ficha"><span class="poster"><img src="${K.art(it)}" alt="" loading="lazy" width="400" height="600"></span><span class="card-title">${esc(it.name)}</span></a>
      ${meta(it)}
      <div class="card-foot">${stampSm(it)}<button class="icon-btn sm" aria-label="Añadir «${esc(it.name)}» a una lista">${icon('listPlus', 18)}</button></div>
    </article>`;
  const arrows = (id) => `<div class="arrows"><button class="icon-btn" data-row="${id}" data-dir="-1" aria-controls="${id}" aria-label="Anteriores">${icon('chevL')}</button><button class="icon-btn" data-row="${id}" data-dir="1" aria-controls="${id}" aria-label="Siguientes">${icon('chevR')}</button></div>`;
  const row = (id, ids, labelId) => `<div class="row" id="${id}" tabindex="0" aria-labelledby="${labelId}">${ids.map((i) => card(K.byId[i])).join('')}</div>`;
  const secHead = (id, title, { more = true, rowId } = {}) => `<div class="sec-head"><h2 id="${id}">${title}</h2><div class="sec-tools">${more ? `<a class="link" href="#">Ver todo<span class="sr-only">: ${title}</span></a>` : ''}${rowId ? arrows(rowId) : ''}</div></div>`;

  // --- Portada ---
  const H = K.home;
  const board = [
    { name: 'marta_viaja', kudos: '61,8 K' },
    { name: 'noctambulo', kudos: '46,3 K' },
    { name: K.user.name, kudos: K.user.kudosLabel, me: true },
  ];
  $('[data-screen="home"]').innerHTML = `<div class="wrap">
    <section class="hero" aria-labelledby="home-h1">
      <p class="kicker">Tu diario · jueves, 26 de noviembre</p>
      <h1 class="display" id="home-h1">${esc(H.title)}</h1>
      <p class="lede">${esc(H.subtitle)}</p>
      <nav class="cats" aria-label="Categorías">${Object.values(K.categories).map((c) => `<a class="cat" href="#">${icon(catIcon[c.slug], 22)}${esc(c.label)}</a>`).join('')}</nav>
    </section>
    <section aria-labelledby="h-foryou">
      ${secHead('h-foryou', 'Para ti')}
      ${H.forYou.map((g, n) => `<div class="row-head"><h3 id="fy-${n}-t">Porque te gustó <span class="serif">${esc(g.because)}</span></h3>${arrows(`fy-${n}`)}</div>${row(`fy-${n}`, g.ids, `fy-${n}-t`)}`).join('')}
    </section>
    <section class="ranking" aria-labelledby="h-rank">
      <div>
        <p class="kicker">Ranking de la semana</p>
        <h2 id="h-rank">Quién suma más kudos</h2>
        <p>Votar, comentar y crear listas suma kudos. Vas el #${K.user.rank}: te faltan 1,1 K para el #2.</p>
        <div class="ranking-cta">${kudos(K.user.kudosLabel, true)}<a class="link" href="#">Ver ranking completo</a></div>
      </div>
      <ol class="podium">${board.map((u, i) => `<li class="p${i + 1}${u.me ? ' me' : ''}"><span class="pos" aria-hidden="true">${i + 1}</span><span class="p-name"><span class="sr-only">Puesto ${i + 1}: </span>${esc(u.name)}${u.me ? '<span class="me-tag">(tú)</span>' : ''}</span>${kudos(u.kudos)}</li>`).join('')}</ol>
    </section>
    <section aria-labelledby="h-news">${secHead('h-news', 'Novedades', { rowId: 'news' })}${row('news', H.news, 'h-news')}</section>
    <section aria-labelledby="h-top">${secHead('h-top', 'Mejor valorados', { rowId: 'top' })}${row('top', H.top, 'h-top')}</section>
    <section aria-labelledby="h-lists">
      ${secHead('h-lists', 'Listas')}
      <div class="lists">${H.lists.map((l) => {
        const its = l.ids.map((i) => K.byId[i]);
        const cats = [...new Set(its.map((it) => it.cat))];
        return `<a class="list-card" href="#"><span class="collage">${its.map((it) => `<img src="${K.art(it, { title: false })}" alt="" loading="lazy">`).join('')}</span>
          <span class="list-title">${esc(l.title)}</span>
          <span class="list-meta"><span>Lista de @${esc(l.by)} · <span class="num">${l.count}</span> elementos</span>${cats.map((c) => `<span title="${K.categories[c].label}">${icon(catIcon[c], 16)}</span>`).join('')}<span class="sr-only">Incluye: ${cats.map((c) => K.categories[c].label).join(', ')}</span></span></a>`;
      }).join('')}</div>
    </section>
  </div>`;

  // --- Ficha ---
  const D = K.detail;
  const it = K.byId[D.id];
  const maxDist = Math.max(...D.distribution);
  const levelsDesc = [...K.vote.levels].reverse();
  $('[data-screen="ficha"]').innerHTML = `<div class="wrap">
    <nav class="crumbs" aria-label="Migas de pan"><a href="#" data-go="home">Inicio</a> / <a href="#">${K.categories[it.cat].label}</a> / <span aria-current="page">${esc(it.name)}</span></nav>
    <div class="detail">
      <figure class="detail-poster" style="margin-block:0"><img src="${K.art(it)}" alt="Póster de «${esc(it.name)}» (ilustración de la maqueta)" width="400" height="600"><figcaption>Imagen: TMDB</figcaption></figure>
      <article class="detail-body" aria-labelledby="detail-h1">
        <p class="kicker">${K.categories[it.cat].short} · <span class="num">${it.year}</span></p>
        <h1 class="detail-title" id="detail-h1">${esc(it.name)}</h1>
        <p class="original">Título original: <i>${esc(D.original)}</i></p>
        <div class="chips">${it.genres.map((g) => `<span class="chip">${esc(g)}</span>`).join('')}</div>
        <dl class="facts"><div><dt>Dirección</dt><dd>${esc(D.director)}</dd></div><div><dt>Duración</dt><dd class="num">${esc(D.runtime)}</dd></div><div><dt>País</dt><dd>${esc(D.country)}</dd></div></dl>
        <div class="score-block">
          <div class="stamp-lg" role="img" aria-label="Nota media ${K.score(it.avg)} de 10"><b>${K.score(it.avg)}</b><span>de 10</span></div>
          <div>
            <div class="dist-head"><b>Nota de la comunidad</b><span class="num">${K.votesLabel(it.votes)}</span></div>
            <ul class="dist" aria-label="Distribución de votos">${levelsDesc.map((l, i) => `<li><span>${l.label}</span><span class="bar" aria-hidden="true"><i style="width:${(D.distribution[i] / maxDist) * 100}%"></i></span><span class="n">${D.distribution[i]}</span></li>`).join('')}</ul>
          </div>
        </div>
        <div class="actions">
          <a class="btn btn-primary" href="#" data-go="votar">${icon('check', 18)} Votar</a>
          <button class="btn btn-secondary">${icon('listPlus', 18)} Añadir a lista</button>
          <button class="btn btn-ghost" aria-pressed="false" data-toggle-press>${icon('bookmark', 18)} Wishlist</button>
        </div>
        <section aria-labelledby="h-about">
          ${secHead('h-about', 'Acerca de', { more: false })}
          <div class="prose">${D.about.map((p) => `<p>${esc(p)}</p>`).join('')}</div>
          <p class="source">Texto: ${esc(D.aboutSource)}.</p>
        </section>
        <section aria-labelledby="h-comments">
          ${secHead('h-comments', `Comentarios <span class="num">(${D.comments.length})</span>`, { more: false })}
          <form class="comment-form" onsubmit="return false">
            <label for="comment-text">Escribe un comentario</label>
            <textarea id="comment-text" placeholder="¿Qué te ha parecido?" aria-describedby="comment-hint"></textarea>
            <div class="form-foot"><span id="comment-hint">Sé amable: cualquiera puede reportar un comentario.</span><button class="btn btn-primary" type="submit">Publicar</button></div>
          </form>
          <ul class="comments">${D.comments.map((c) => `<li><div class="c-head"><span class="c-avatar" aria-hidden="true">${esc(c.user[0].toUpperCase())}</span><span><span class="c-user">${esc(c.user)}</span><br><span class="c-when">${esc(c.when)}</span></span><span class="stamp-sm" aria-label="Su nota: ${c.score} de 10">${c.score}</span></div><p>${esc(c.text)}</p></li>`).join('')}</ul>
        </section>
      </article>
    </div>
    <section aria-labelledby="h-similar">${secHead('h-similar', 'Similares', { more: false, rowId: 'similar' })}${row('similar', D.similar, 'h-similar')}</section>
    <p class="credit">Datos e imagen de TMDB. Texto de ${esc(D.aboutSource)}.</p>
  </div>`;

  // --- Votar ---
  const V = K.vote;
  const vi = K.byId[V.id];
  let left = V.queueLeft;
  const total = V.queueLeft + 7;
  $('[data-screen="votar"]').innerHTML = `<div class="wrap">
    <div class="vote-top">
      <div><p class="kicker">Votar · ${K.categories[vi.cat].label}</p><div class="progress"><span>Quedan <b class="num" id="vote-left">${left}</b> por votar</span><span class="track" aria-hidden="true"><i id="vote-track"></i></span></div></div>
      <p class="earn">Cada voto suma kudos ${kudos(K.user.kudosLabel)}</p>
    </div>
    <div class="vote">
      <div class="vote-poster"><img src="${K.art(vi)}" alt="Póster de «${esc(vi.name)}» (ilustración de la maqueta)" width="400" height="600"></div>
      <div>
        <p class="kicker">${K.categories[vi.cat].short} · <span class="num">${vi.year}</span> · ${esc(vi.genres.join(', '))}</p>
        <h1 class="vote-title">${esc(vi.name)}</h1>
        <p class="synopsis">${esc(V.synopsis)}</p>
        <section class="question" id="vote-q" aria-live="polite"></section>
        <div class="vote-links"><a class="link" href="#" data-go="ficha">Ver ficha completa</a><a class="link" href="#">Comentar</a></div>
      </div>
    </div>
  </div>`;

  let step = 'know';
  let doneTimer = null;
  const back = `<button class="btn btn-ghost back" data-vote="back">${icon('arrowL', 18)} Volver <kbd>Esc</kbd></button>`;
  function renderVote(moveFocus) {
    const box = $('#vote-q');
    const html = {
      know: `<h2 class="q" tabindex="-1">¿Lo conoces?</h2>
        <div class="choices"><button class="btn btn-secondary btn-lg" data-vote="no">${icon('x', 18)} No <kbd>N</kbd></button><button class="btn btn-primary btn-lg" data-vote="yes">${icon('check', 18)} Sí <kbd>S</kbd></button></div>
        <p class="hint">Atajos: S sí · N no</p>`,
      score: `<h2 class="q" tabindex="-1">¿Qué te ha parecido?</h2>
        <div class="levels">${V.levels.map((l, i) => `<button class="btn btn-secondary level" data-score="${l.score}"><span class="dots" aria-hidden="true">${[0, 1, 2, 3, 4].map((d) => `<i class="${d <= i ? 'on' : ''}"></i>`).join('')}</span><span class="level-label">${l.label}</span><kbd>${l.key}</kbd></button>`).join('')}</div>${back}`,
      interest: `<h2 class="q" tabindex="-1">¿Te interesa?</h2>
        <div class="choices"><button class="btn btn-primary btn-lg" data-vote="want">${icon('bookmark', 18)} Me interesa <kbd>1</kbd></button><button class="btn btn-secondary btn-lg" data-vote="pass">${icon('eyeOff', 18)} No me interesa <kbd>2</kbd></button></div>${back}`,
      done: `<div class="done"><span class="done-ico">${icon('check', 24)}</span><div><h2 class="q" tabindex="-1">¡Hecho!</h2><p>Tu voto suma kudos <span class="kudos-badge">${star()}<span>+ kudos</span></span></p></div></div>`,
    }[step];
    const hadFocus = box.contains(document.activeElement) || document.activeElement === document.body;
    box.innerHTML = html;
    $('#vote-left').textContent = left;
    $('#vote-track').style.width = `${((total - left) / total) * 100}%`;
    if (moveFocus && hadFocus) box.querySelector('.q').focus({ preventScroll: true });
  }
  function go(next) {
    clearTimeout(doneTimer);
    step = next;
    if (next === 'done') {
      doneTimer = setTimeout(() => { left = Math.max(0, left - 1); step = 'know'; renderVote(true); }, 1500);
    }
    renderVote(true);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-vote], [data-score]');
    if (b && $('#vote-q').contains(b)) {
      if (b.dataset.score) return go('done');
      ({ yes: () => go('score'), no: () => go('interest'), back: () => go('know'), want: () => go('done'), pass: () => go('done') })[b.dataset.vote]?.();
    }
    const t = e.target.closest('[data-toggle-press]');
    if (t) t.setAttribute('aria-pressed', String(t.getAttribute('aria-pressed') !== 'true'));
  });

  // Teclado: Escape cierra antes los paneles; los atajos de votar solo actúan en su pantalla.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && open) { const b = open.btn; setOpen(open, false); b.focus(); return; }
    if (window.Mockup?.screen !== 'votar' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('input, textarea, select')) return;
    const k = e.key.toLowerCase();
    if (step === 'know') { if (k === 's') go('score'); if (k === 'n') go('interest'); }
    else if (step === 'score') { if (/^[1-5]$/.test(k)) go('done'); if (k === 'escape') go('know'); }
    else if (step === 'interest') { if (k === '1' || k === '2') go('done'); if (k === 'escape') go('know'); }
  });

  // --- Filas con flechas ---
  function updateArrows(r) {
    document.querySelectorAll(`[data-row="${r.id}"]`).forEach((b) => {
      const atStart = r.scrollLeft <= 2;
      const atEnd = r.scrollLeft + r.clientWidth >= r.scrollWidth - 2;
      b.disabled = b.dataset.dir === '-1' ? atStart : atEnd;
    });
  }
  document.querySelectorAll('.row').forEach((r) => { r.addEventListener('scroll', () => updateArrows(r), { passive: true }); });
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-row]');
    if (!b) return;
    const r = document.getElementById(b.dataset.row);
    r.scrollBy({ left: Number(b.dataset.dir) * r.clientWidth * 0.9, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
  });
  const refreshRows = () => document.querySelectorAll('.row').forEach(updateArrows);
  window.addEventListener('resize', refreshRows);

  // --- Pie ---
  const F = K.footer;
  $('#footer').innerHTML = `<div class="wrap">
    <div class="footer-grid">
      <div><p class="f-brand">${logoMark(24)}${esc(F.brand)}</p><p class="f-muted">${esc(F.author)}</p><p class="f-links"><a href="#">Privacidad</a><a href="#">Aviso legal</a></p></div>
      <p class="f-school"><b>${esc(F.school)}</b><span class="f-muted">${esc(F.schoolSub)}</span></p>
      <a class="f-gh" href="#">${icon('github', 18)} GitHub</a>
    </div>
    <div class="attrib">
      <div class="attrib-row"><span class="tmdb-mark" aria-label="TMDB">TMDB</span><p>${esc(F.tmdb)}</p></div>
      <p>${esc(F.igdb)}</p>
    </div>
  </div>`;

  // Al cambiar de pantalla: cerrar paneles, reiniciar la votación y marcar la navegación activa.
  document.addEventListener('mockup:screen', (e) => {
    if (open) setOpen(open, false);
    clearTimeout(doneTimer);
    step = 'know';
    renderVote(false);
    document.querySelectorAll('[data-nav-home]').forEach((a) => {
      if (e.detail === 'home') a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    requestAnimationFrame(refreshRows);
  });
  renderVote(false);
})();
</script>
</body>
</html>
