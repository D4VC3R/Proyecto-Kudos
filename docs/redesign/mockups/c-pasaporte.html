<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta C · Pasaporte</title>
<script src="shared/data.js"></script>
<script src="shared/mockup.js"></script>
<style>
/* --- Fuentes autoalojadas --- */
@font-face { font-family: 'Bricolage Grotesque'; src: url('fonts/bricolage-grotesque-latin-opsz-normal.woff2') format('woff2-variations'); font-weight: 200 800; font-display: swap; }
@font-face { font-family: 'Figtree'; src: url('fonts/figtree-latin-wght-normal.woff2') format('woff2-variations'); font-weight: 300 900; font-display: swap; }

/* --- Tokens: paleta exacta de la dirección C --- */
:root {
  --base: #FFFCF5; --surface: #FFFFFF; --ink: #1E1B2E; --muted: #5B5670;
  --pelis: #E11D48; --series: #7C3AED; --juegos: #047857; --destinos: #0369A1; --kudos: #FBBF24;
  --on-cat: #FFFFFF; --on-kudos: #1E1B2E;
  --line: rgb(30 27 46 / .12); --line-strong: #5B5670; --tint: rgb(30 27 46 / .05); --tint-2: rgb(30 27 46 / .09);
  --focus: var(--series);
  --shadow: 0 1px 0 rgb(30 27 46 / .05), 0 10px 28px -16px rgb(30 27 46 / .35);
  --head: 'Bricolage Grotesque', system-ui, sans-serif; --body: 'Figtree', system-ui, sans-serif;
  color-scheme: light;
}
html.dark {
  --base: #17151F; --surface: #211E2B; --ink: #F4F2FA; --muted: #A9A4BC;
  --pelis: #FB7185; --series: #A78BFA; --juegos: #34D399; --destinos: #38BDF8; --kudos: #FBBF24;
  --on-cat: #17151F; --on-kudos: #17151F;
  --line: rgb(244 242 250 / .12); --line-strong: #A9A4BC; --tint: rgb(244 242 250 / .06); --tint-2: rgb(244 242 250 / .1);
  --shadow: 0 1px 0 rgb(0 0 0 / .3), 0 10px 28px -16px rgb(0 0 0 / .7);
  color-scheme: dark;
}
.c-peliculas { --c: var(--pelis); } .c-series { --c: var(--series); }
.c-videojuegos { --c: var(--juegos); } .c-destinos { --c: var(--destinos); }

/* --- Base --- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--base); color: var(--ink); font: 400 16px/1.55 var(--body); }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--head); font-optical-sizing: auto; line-height: 1.1; margin: 0; letter-spacing: -.015em; }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -.03em; }
h2 { font-size: clamp(1.35rem, 3vw, 1.7rem); font-weight: 750; }
h3 { font-size: 1.1rem; font-weight: 700; }
p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 768px) { .wrap { padding-inline: 24px; } }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 16px; top: -60px; z-index: 100; padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--base); font-weight: 700; text-decoration: none; }
.skip:focus { top: 12px; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* --- Botones y chips --- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px;
  border: 2px solid var(--ink); background: var(--ink); color: var(--base); font-weight: 700; cursor: pointer; text-decoration: none; transition: transform .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.secondary { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.secondary:hover { border-color: var(--ink); }
.btn.cat { background: var(--c); border-color: var(--c); color: var(--on-cat); }
.btn[aria-pressed="true"] { background: var(--tint-2); color: var(--ink); border-color: var(--ink); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 999px; border: 0; background: transparent; cursor: pointer; color: var(--ink); }
.icon-btn:hover { background: var(--tint-2); }
.icon-btn.sm { width: 34px; height: 34px; }
.icon-btn.sm svg.i { width: 18px; height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--tint-2); font-size: .8125rem; font-weight: 700; white-space: nowrap; }
kbd { font: 700 .75rem/1 var(--body); padding: 3px 6px; border-radius: 6px; border: 1px solid currentColor; opacity: .85; }

/* --- Sellos (kudos, notas, insignias) --- */
.stamp { display: inline-grid; place-items: center; border-radius: 50%; font-family: var(--head); font-weight: 800; transform: rotate(-7deg);
  border: 2px solid currentColor; box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 4px currentColor; }
.score { width: 42px; height: 42px; font-size: .9rem; color: var(--ink); background: var(--surface); }
.no-score { font-size: .75rem; font-weight: 700; color: var(--muted); }
.kudos-badge { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--kudos); color: var(--on-kudos);
  font: 800 .8125rem/1 var(--body); font-variant-numeric: tabular-nums; box-shadow: inset 0 0 0 2px var(--kudos), inset 0 0 0 3px var(--on-kudos); }
.kudos-badge svg.i { width: 16px; height: 16px; fill: var(--on-kudos); stroke: var(--on-kudos); }
.big-stamp { width: 132px; height: 132px; background: var(--kudos); color: var(--on-kudos); border-color: var(--on-kudos);
  box-shadow: inset 0 0 0 5px var(--kudos), inset 0 0 0 7px var(--on-kudos); text-align: center; line-height: 1.05; }
.big-stamp b { display: block; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.big-stamp small { font: 700 .7rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .08em; }

/* --- Cabecera --- */
.site-head { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--base) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: 8px; height: 64px; }
.logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font: 800 1.35rem/1 var(--head); letter-spacing: -.02em; }
.logo svg { width: 34px; height: 34px; }
.nav { display: none; align-items: center; gap: 4px; margin-left: 16px; }
.nav a { white-space: nowrap; padding: 8px 12px; border-radius: 999px; text-decoration: none; font-weight: 600; color: var(--muted); }
.nav a:hover { color: var(--ink); background: var(--tint); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--tint-2); font-weight: 800; }
.spacer { flex: 1; }
.search { display: none; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); width: 240px; }
.search input { border: 0; outline: 0; background: transparent; width: 100%; }
.search:focus-within { outline: 2px solid var(--focus); outline-offset: 3px; }
.search ::placeholder { color: var(--muted); }
.head-extra { display: none; }
.user-btn { display: inline-flex; align-items: center; gap: 6px; padding: 4px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--tint-2); font: 800 .8rem var(--head); }
.user-name { display: none; font-weight: 700; font-size: .875rem; }
.rank { font-weight: 800; font-size: .8125rem; color: var(--muted); padding-right: 6px; font-variant-numeric: tabular-nums; }
.menu-btn { margin-left: -8px; }
.pop { position: absolute; z-index: 60; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; }
.pop a, .pop button.item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 0; background: none; text-align: left; text-decoration: none; font-weight: 600; cursor: pointer; }
.pop a:hover, .pop button.item:hover { background: var(--tint); }
.user-menu { right: 16px; top: 60px; min-width: 220px; }
.mobile-menu { left: 0; right: 0; top: 64px; border-radius: 0 0 16px 16px; padding: 16px; display: grid; gap: 6px; }
.mobile-menu .search { display: flex; width: 100%; margin-bottom: 8px; }
.danger-text { color: var(--pelis); }
@media (min-width: 480px) { .head-extra { display: inline-grid; } }
@media (min-width: 640px) { .user-name { display: inline; } }
@media (min-width: 768px) { .search { display: flex; } .mobile-menu .search { display: none; } }
@media (min-width: 1200px) { .nav { display: flex; } .menu-btn, .mobile-menu { display: none !important; } }

/* --- Portada --- */
.hero { display: grid; gap: 24px; padding: 32px 0 8px; }
.hero p { margin-top: 12px; max-width: 56ch; font-size: 1.0625rem; }
.passport { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 20px; border-radius: 20px;
  background: var(--surface); border: 2px dashed var(--line-strong); }
.passport h2 { font-size: 1.15rem; }
.passport ul { list-style: none; margin: 8px 0 14px; padding: 0; display: grid; gap: 4px; font-size: .9375rem; }
@media (min-width: 900px) { .hero { grid-template-columns: 1fr 380px; align-items: center; padding-top: 48px; } }
.cats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 24px 0 8px; }
.cat-link { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface);
  text-decoration: none; font: 700 1rem var(--head); }
.cat-link:hover { border-color: var(--c); }
.cat-link .dot { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; background: var(--c); color: var(--on-cat); }
@media (min-width: 768px) { .cats { grid-template-columns: repeat(4, 1fr); } }
.section { margin-top: 44px; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-head p { margin-top: 4px; font-size: .9375rem; }
.sub-head { margin: 22px 0 10px; }
.arrows { display: none; gap: 6px; }
.arrows .icon-btn { border: 1.5px solid var(--line-strong); }
@media (min-width: 1024px) { .arrows { display: flex; } }
.row { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; margin-inline: -16px; padding: 4px 16px 10px; scrollbar-width: thin; }
@media (min-width: 768px) { .row { margin-inline: -24px; padding-inline: 24px; scroll-padding-inline: 24px; } }
.row > * { scroll-snap-align: start; flex: none; }
.row:focus-visible { outline-offset: -2px; }

/* Tarjeta de ítem: el único color es el borde de su categoría */
.card { position: relative; width: 148px; display: flex; flex-direction: column; border-radius: 16px; border: 2px solid var(--c); background: var(--surface); overflow: hidden; transition: transform .2s; }
.card:hover { transform: translateY(-3px); }
.card:has(a:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
.card a:focus-visible { outline: 0; }
.card img { aspect-ratio: 2 / 3; width: 100%; object-fit: cover; }
.card-body { display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 8px; flex: 1; }
.card-title { font: 700 .9375rem/1.25 var(--head); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-title a { text-decoration: none; }
.card-title a::after { content: ''; position: absolute; inset: 0; }
.card-meta { font-size: .8125rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 6px; }
.card-foot .icon-btn { position: relative; z-index: 1; color: var(--muted); }
.card-foot .icon-btn:hover { color: var(--ink); }
@media (min-width: 768px) { .card { width: 176px; } }

/* Liga */
.league { border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.league table { width: 100%; border-collapse: collapse; }
.league th { text-align: left; font: 700 .75rem var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 16px; border-bottom: 1px solid var(--line); }
.league td { padding: 12px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.league tr:last-child td { border-bottom: 0; }
.league tr.me td { background: var(--tint); }
.league .pos { width: 64px; }
.pos .stamp { width: 36px; height: 36px; font-size: .95rem; color: var(--ink); background: var(--surface); }
.pos .stamp.gold { background: var(--kudos); color: var(--on-kudos); box-shadow: inset 0 0 0 3px var(--kudos), inset 0 0 0 4px var(--on-kudos); border-color: var(--on-kudos); }
.league td.k { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.league-foot { padding: 12px 16px; border-top: 1px solid var(--line); }
.league-foot a { font-weight: 700; }

/* Listas editoriales: neutras; los puntos indican qué mezclan */
.list-card { position: relative; width: 260px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); overflow: hidden; }
.list-card:hover { border-color: var(--line-strong); }
.list-card:has(a:focus-visible) { outline: 2px solid var(--focus); outline-offset: 3px; }
.list-card a:focus-visible { outline: 0; }
.mosaic { display: grid; grid-template-columns: repeat(4, 1fr); }
.mosaic img { aspect-ratio: 2 / 3; width: 100%; object-fit: cover; }
.list-card .body { padding: 12px 14px 14px; }
.list-card h3 a { text-decoration: none; }
.list-card h3 a::after { content: ''; position: absolute; inset: 0; }
.dots { display: flex; gap: 5px; margin-top: 10px; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
@media (min-width: 768px) { .list-card { width: 300px; } }

/* --- Ficha --- */
.crumbs { display: flex; gap: 8px; flex-wrap: wrap; padding: 20px 0 0; font-size: .875rem; color: var(--muted); }
.crumbs a { font-weight: 600; }
.detail { display: grid; gap: 24px; padding: 16px 0 0; }
.poster { border-radius: 20px; border: 2px solid var(--c); overflow: hidden; background: var(--surface); max-width: 340px; width: 100%; justify-self: center; }
.poster img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
.poster figcaption { padding: 8px 12px; font-size: .75rem; color: var(--muted); }
@media (min-width: 900px) {
  .detail { grid-template-columns: 340px 1fr; gap: 48px; align-items: start; }
  .poster { position: sticky; top: 88px; }
}
.kicker { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: var(--c); color: var(--on-cat); font-weight: 800; font-size: .8125rem; }
.detail h1 { margin-top: 12px; }
.orig { margin-top: 6px; color: var(--muted); font-size: 1.0625rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 22px 0 0; }
.facts div { padding: 12px 14px; border-radius: 14px; background: var(--tint); }
.facts dt { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; font-weight: 700; }
.rating { display: grid; gap: 20px; align-items: center; margin-top: 24px; padding: 20px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.rating .score { width: 96px; height: 96px; font-size: 1.9rem; box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 6px currentColor; }
.rating-main { display: flex; align-items: center; gap: 18px; }
.bars { display: grid; gap: 6px; list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 96px 1fr 24px; align-items: center; gap: 10px; font-size: .875rem; }
.bar { height: 10px; border-radius: 999px; background: var(--tint-2); overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: inherit; background: var(--c); }
@media (min-width: 640px) { .rating { grid-template-columns: auto 1fr; } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.prose { margin-top: 32px; max-width: 68ch; }
.prose p { margin-top: 12px; font-size: 1.0625rem; }
.source { margin-top: 12px; font-size: .8125rem; color: var(--muted); }
.comments { display: grid; gap: 24px; margin-top: 8px; }
@media (min-width: 900px) { .comments { grid-template-columns: 340px 1fr; gap: 48px; } }
.form { display: grid; gap: 10px; align-content: start; }
.form label { font-weight: 700; }
.form textarea { min-height: 120px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); resize: vertical; }
.form textarea:focus-visible { outline-offset: 2px; }
.form .btn { justify-self: start; }
.comment { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.comment + .comment { margin-top: 12px; }
.comment p { margin-top: 4px; }
.comment .score { width: 38px; height: 38px; font-size: .85rem; }
.credit { margin-top: 28px; font-size: .8125rem; color: var(--muted); }

/* --- Votar --- */
.vote { display: grid; gap: 20px; max-width: 1000px; margin: 0 auto; padding: 20px 0 0; }
.vote .poster { max-width: 220px; }
@media (min-width: 768px) { .vote { grid-template-columns: 300px 1fr; gap: 40px; align-items: start; padding-top: 32px; } .vote .poster { max-width: none; position: sticky; top: 88px; } }
.progress { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: .875rem; }
.progress .track { flex: 1 1 100%; height: 8px; border-radius: 999px; background: var(--tint-2); overflow: hidden; order: 3; }
.progress .track span { display: block; height: 100%; width: 38%; background: var(--ink); border-radius: inherit; }
.vote h1 { font-size: clamp(1.8rem, 4.5vw, 2.6rem); margin-top: 14px; }
.vote .syn { margin-top: 10px; color: var(--muted); max-width: 60ch; }
.vote-card { position: relative; margin-top: 22px; padding: 22px; border-radius: 20px; background: var(--surface); border: 2px solid var(--c); min-height: 220px; }
.vote-card h2 { font-size: 1.5rem; }
.vote-card .hint { margin-top: 4px; color: var(--muted); font-size: .9375rem; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.choices .btn { min-height: 56px; font-size: 1.0625rem; border-radius: 16px; }
.levels { display: grid; gap: 8px; margin-top: 18px; }
.levels .btn { justify-content: space-between; border-radius: 14px; }
.levels .btn:hover { border-color: var(--c); }
@media (min-width: 1024px) { .levels { grid-template-columns: repeat(5, 1fr); } .levels .btn { flex-direction: column; justify-content: center; min-height: 84px; padding: 10px 6px; font-size: .9375rem; } }
.back { margin-top: 14px; }
.done { display: grid; justify-items: center; text-align: center; gap: 12px; padding-top: 8px; }
.drop { animation: drop .5s cubic-bezier(.3, 1.4, .6, 1) both; }
@keyframes drop { from { transform: scale(1.9) rotate(-22deg); opacity: 0; } to { transform: scale(1) rotate(-7deg); opacity: 1; } }
.earn { display: flex; gap: 10px; align-items: center; margin-top: 18px; font-size: .9375rem; }

/* --- Pie --- */
.site-foot { margin-top: 64px; border-top: 1px solid var(--line); background: var(--surface); }
.foot-grid { display: grid; gap: 20px; padding: 28px 0; }
.foot-grid .links { display: flex; gap: 16px; margin-top: 6px; }
.foot-grid .links a, .gh { font-weight: 600; }
.gh { display: inline-flex; gap: 8px; align-items: center; text-decoration: none; }
@media (min-width: 768px) { .foot-grid { grid-template-columns: 1fr auto 1fr; align-items: center; } .foot-grid .center { text-align: center; } .gh { justify-self: end; } }
.attr { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: center; padding: 18px 0 28px; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--muted); text-align: center; }
.tmdb { padding: 4px 10px; border-radius: 8px; border: 2px solid var(--destinos); color: var(--destinos); font: 800 .9rem/1 var(--head); letter-spacing: .14em; }
.attr p { max-width: 70ch; }
.attr .igdb { flex-basis: 100%; }
.attr strong { color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>

<header class="site-head">
  <div class="wrap head-row">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobileMenu"></button>
    <a class="logo" href="#" data-go="home" aria-label="Kudos, ir a la portada"><span id="logoMark"></span>Kudos</a>
    <nav class="nav" id="nav" aria-label="Principal"></nav>
    <span class="spacer"></span>
    <label class="search"><span id="searchIcon"></span><span class="sr-only">Buscar</span><input type="search" placeholder="Buscar en Kudos…"></label>
    <button class="icon-btn head-extra" data-theme-toggle id="themeBtn" aria-label="Cambiar a modo oscuro"></button>
    <button class="icon-btn head-extra" id="bellBtn" aria-label="Notificaciones (2 nuevas)"></button>
    <button class="user-btn" id="userBtn" aria-expanded="false" aria-controls="userMenu" aria-haspopup="true"></button>
  </div>
  <div class="pop mobile-menu" id="mobileMenu" hidden></div>
  <div class="pop user-menu" id="userMenu" hidden></div>
</header>

<div id="contenido" tabindex="-1">
  <main data-screen="home" class="wrap" id="screenHome"></main>
  <main data-screen="ficha" class="wrap" id="screenFicha" hidden></main>
  <main data-screen="votar" class="wrap" id="screenVotar" hidden></main>
</div>

<footer class="site-foot">
  <div class="wrap" id="footer"></div>
</footer>

<script>
(function () {
  const K = window.KUDOS;
  const $ = (s) => document.querySelector(s);

  // --- Iconos (trazo redondeado) ---
  const P = {
    star: '<path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',
    bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    listplus: '<path d="M4 6h11M4 12h11M4 18h7M18 15v6M15 18h6"/>',
    bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
    left: '<path d="M15 6l-6 6 6 6"/>',
    right: '<path d="M9 6l6 6-6 6"/>',
    back: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    tv: '<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 3l4 4 4-4"/>',
    game: '<path d="M7 9h4M9 7v4"/><circle cx="15.5" cy="10" r="1"/><circle cx="17.5" cy="12" r="1"/><path d="M6.5 5h11A4.5 4.5 0 0 1 22 9.5V15a3 3 0 0 1-5.4 1.8L15 15H9l-1.6 1.8A3 3 0 0 1 2 15V9.5A4.5 4.5 0 0 1 6.5 5z"/>',
    pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    eyeoff: '<path d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0 1 12 6c6 0 9.5 6 9.5 6a16 16 0 0 1-3.2 3.9M6.4 7.4C3.9 9.1 2.5 12 2.5 12s3.5 6 9.5 6a9 9 0 0 0 4-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    logout: '<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/>',
    github: '<path d="M9 19c-4 1.3-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-.8-2.3c2.7-.3 5.5-1.3 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.3 4.3 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.5 2.5 5.5 2.8 5.5 2.8a4.3 4.3 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.1 9.2c0 4.6 2.8 5.7 5.5 6a3 3 0 0 0-.8 2.3V21"/>',
  };
  const icon = (n, extra = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true" ${extra}>${P[n]}</svg>`;
  const catIcon = { peliculas: 'film', series: 'tv', videojuegos: 'game', destinos: 'pin' };

  // Logotipo: estrella dentro de un sello de pasaporte (doble anillo, ligeramente girado).
  const logo = `<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-10 20 20)">
    <circle cx="20" cy="20" r="18" fill="var(--kudos)"/><circle cx="20" cy="20" r="18" fill="none" stroke="var(--on-kudos)" stroke-width="2"/>
    <circle cx="20" cy="20" r="14.5" fill="none" stroke="var(--on-kudos)" stroke-width="1" stroke-dasharray="2 2.2"/>
    <path d="M20 10.5l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L20 24.3l-5.4 2.9 1.1-6.1-4.5-4.2 6.1-.8z" fill="var(--on-kudos)"/></g></svg>`;

  const scoreStamp = (it, cls = '') => {
    const s = K.score(it.avg);
    return s ? `<span class="stamp score num ${cls}" aria-label="Nota ${s}">${s}</span>` : '<span class="no-score">Sin nota</span>';
  };
  const meta = (it) => [it.year ?? (it.place || '').split(',')[0], it.genres[0]].filter(Boolean).join(' · ');

  function card(it, h = 'h3') {
    return `<article class="card c-${it.cat}">
      <img src="${K.art(it)}" alt="" loading="lazy" width="400" height="600">
      <div class="card-body">
        <${h} class="card-title"><a href="#" data-go="ficha">${it.name}</a></${h}>
        <p class="card-meta">${meta(it)}</p>
        <div class="card-foot">${scoreStamp(it)}
          <button class="icon-btn sm" type="button" aria-label="Añadir «${it.name}» a una lista">${icon('listplus')}</button></div>
      </div></article>`;
  }

  let rowN = 0;
  function row(ids, label, h) {
    const id = `row-${++rowN}`;
    return { id, html: `<div class="row" id="${id}" role="region" aria-label="${label}" tabindex="0">${ids.map((i) => card(K.byId[i], h)).join('')}</div>` };
  }
  const arrows = (id, label) => `<div class="arrows">
      <button class="icon-btn" type="button" data-scroll="-1" data-target="${id}" aria-label="Anteriores en ${label}">${icon('left')}</button>
      <button class="icon-btn" type="button" data-scroll="1" data-target="${id}" aria-label="Siguientes en ${label}">${icon('right')}</button></div>`;

  // --- Cabecera ---
  function renderHeader() {
    $('#logoMark').innerHTML = logo;
    $('#searchIcon').innerHTML = icon('search');
    $('#menuBtn').innerHTML = icon('menu');
    $('#bellBtn').innerHTML = icon('bell');
    const links = K.nav.map((n, i) => `<a href="#" ${n.key === 'categorias' ? 'data-go="home"' : 'data-nop'} ${i === 0 ? 'aria-current="page"' : ''}>${n.label}</a>`).join('');
    $('#nav').innerHTML = links;
    $('#userBtn').innerHTML = `<span class="avatar">K</span><span class="user-name">${K.user.name}</span>
      <span class="kudos-badge" title="Tus kudos">${icon('star')}${K.user.kudosLabel}</span><span class="rank" title="Tu posición en el ranking">#${K.user.rank}</span>
      <span class="sr-only">Abrir el menú de usuario</span>`;
    $('#userMenu').innerHTML = `<a href="#" data-nop>${icon('user')}Mi perfil</a><a href="#" data-nop>${icon('listplus')}Mis propuestas</a>
      <a href="#" data-nop>${icon('star')}Estadísticas</a><button class="item danger-text" type="button">${icon('logout')}Cerrar sesión</button>`;
    $('#mobileMenu').innerHTML = `<label class="search"><span>${icon('search')}</span><span class="sr-only">Buscar</span><input type="search" placeholder="Buscar en Kudos…"></label>
      <nav aria-label="Principal (móvil)">${links}</nav>
      <button class="item" type="button" data-theme-toggle id="themeBtnMobile"></button>`;
    syncTheme();
  }
  function syncTheme() {
    const dark = document.documentElement.classList.contains('dark');
    const label = dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro';
    $('#themeBtn').innerHTML = icon(dark ? 'sun' : 'moon');
    $('#themeBtn').setAttribute('aria-label', label);
    $('#themeBtnMobile').innerHTML = `${icon(dark ? 'sun' : 'moon')}${label}`;
  }
  new MutationObserver(syncTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  // Desplegables: aria-expanded, cierre con Escape y al pulsar fuera.
  function disclosure(btn, panel, onToggle) {
    const set = (open) => {
      panel.hidden = !open; btn.setAttribute('aria-expanded', String(open)); onToggle?.(open);
    };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(panel.hidden); });
    document.addEventListener('click', (e) => { if (!panel.hidden && !panel.contains(e.target)) set(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { set(false); btn.focus(); } });
    panel.addEventListener('click', (e) => { if (e.target.closest('a')) set(false); });
  }

  // --- Portada ---
  function renderHome() {
    const H = K.home;
    const cats = Object.values(K.categories).map((c) => `<a class="cat-link c-${c.slug}" href="#" data-nop><span class="dot">${icon(catIcon[c.slug])}</span>${c.label}</a>`).join('');
    const forYou = H.forYou.map((g) => {
      const r = row(g.ids, `Porque te gustó ${g.because}`, 'h4');
      return `<div class="sec-head sub-head"><h3>Porque te gustó ${g.because}</h3>${arrows(r.id, g.because)}</div>${r.html}`;
    }).join('');
    const news = row(H.news, 'Novedades');
    const top = row(H.top, 'Mejor valorados');
    const league = [
      { user: 'noctambulo', k: '52,8 K' },
      { user: 'marta_viaja', k: '48,1 K' },
      { user: K.user.name, k: K.user.kudosLabel, me: true },
    ];
    const lists = H.lists.map((l) => `<article class="list-card">
        <div class="mosaic">${l.ids.map((i) => `<img src="${K.art(K.byId[i], { title: false })}" alt="" loading="lazy">`).join('')}</div>
        <div class="body"><h3><a href="#" data-nop>${l.title}</a></h3>
          <p class="muted" style="font-size:.875rem;margin-top:4px">De @${l.by} · ${l.count} ítems</p>
          <div class="dots" aria-label="Mezcla ${[...new Set(l.ids.map((i) => K.categories[K.byId[i].cat].label.toLowerCase()))].join(', ')}">
            ${[...new Set(l.ids.map((i) => K.byId[i].cat))].map((c) => `<span class="c-${c}"></span>`).join('')}</div></div></article>`).join('');

    $('#screenHome').innerHTML = `
      <section class="hero" aria-labelledby="home-title">
        <div><h1 id="home-title">${H.title}</h1><p class="muted">${H.subtitle}</p></div>
        <aside class="passport" aria-label="Tu pasaporte">
          <span class="stamp big-stamp"><span><b>${K.user.kudosLabel}</b><small>kudos</small></span></span>
          <div><h2>Tu pasaporte</h2>
            <ul><li>Posición <b class="num">#${K.user.rank}</b> en la liga</li><li>Racha de <b class="num">${K.user.streak}</b> días votando</li></ul>
            <a class="btn" href="#" data-go="votar">Votar y sumar kudos</a></div>
        </aside>
      </section>
      <nav class="cats" aria-label="Categorías">${cats}</nav>
      <section class="section" aria-labelledby="s-foryou"><h2 id="s-foryou">Para ti</h2>${forYou}</section>
      <section class="section" aria-labelledby="s-news"><div class="sec-head"><h2 id="s-news">Novedades</h2>${arrows(news.id, 'Novedades')}</div>${news.html}</section>
      <section class="section" aria-labelledby="s-league">
        <div class="sec-head"><div><h2 id="s-league">Liga de la semana</h2><p class="muted">Quien más vota y comenta, más kudos suma.</p></div></div>
        <div class="league"><table><thead><tr><th scope="col">Puesto</th><th scope="col">Usuario</th><th scope="col" style="text-align:right">Kudos</th></tr></thead><tbody>
          ${league.map((u, i) => `<tr class="${u.me ? 'me' : ''}"><td class="pos"><span class="stamp num ${i === 0 ? 'gold' : ''}">${i + 1}</span></td>
            <td><b>${u.user}</b> ${u.me ? '<span class="chip">Tú</span>' : ''}</td><td class="k">${u.k}</td></tr>`).join('')}
          </tbody></table><div class="league-foot"><a href="#" data-nop>Ver el ranking completo</a></div></div>
      </section>
      <section class="section" aria-labelledby="s-top"><div class="sec-head"><h2 id="s-top">Mejor valorados</h2>${arrows(top.id, 'Mejor valorados')}</div>${top.html}</section>
      <section class="section" aria-labelledby="s-lists"><div class="sec-head"><div><h2 id="s-lists">Listas</h2><p class="muted">Selecciones que mezclan pelis, series, juegos y destinos.</p></div></div>
        <div class="row" role="region" aria-label="Listas" tabindex="0">${lists}</div></section>`;
  }

  // --- Ficha ---
  function renderFicha() {
    const D = K.detail;
    const it = K.byId[D.id];
    const cat = K.categories[it.cat];
    const total = D.distribution.reduce((a, b) => a + b, 0);
    const levelNames = ['Me encantó', 'Muy bien', 'Bien', 'Flojo', 'No me gustó'];
    const bars = D.distribution.map((n, i) => `<li><span>${levelNames[i]}</span><span class="bar"><span style="width:${(n / total) * 100}%"></span></span><span class="num">${n}</span></li>`).join('');
    const sim = row(D.similar, 'Similares');
    const comments = D.comments.map((c) => `<article class="comment"><span class="avatar">${c.user[0].toUpperCase()}</span>
        <div><p><b>${c.user}</b> <span class="muted" style="font-size:.8125rem">· ${c.when}</span></p><p>${c.text}</p></div>
        <span class="stamp score num" aria-label="Le dio ${c.score}">${c.score}</span></article>`).join('');

    $('#screenFicha').innerHTML = `<div class="c-${it.cat}">
      <nav class="crumbs" aria-label="Migas de pan"><a href="#" data-go="home">Portada</a><span aria-hidden="true">/</span><a href="#" data-nop>${cat.label}</a><span aria-hidden="true">/</span><span aria-current="page">${it.name}</span></nav>
      <article class="detail">
        <figure class="poster" style="margin:0"><img src="${K.art(it)}" alt="Póster de ${it.name} (ilustración de la maqueta)" width="400" height="600"><figcaption>Imagen de TMDB</figcaption></figure>
        <div>
          <span class="kicker">${icon(catIcon[it.cat])}${cat.short}</span>
          <h1>${it.name}</h1>
          <p class="orig">${D.original} · ${it.year}</p>
          <div class="chips">${it.genres.map((g) => `<span class="chip">${g}</span>`).join('')}</div>
          <dl class="facts"><div><dt>Dirección</dt><dd>${D.director}</dd></div><div><dt>Duración</dt><dd>${D.runtime}</dd></div><div><dt>País</dt><dd>${D.country}</dd></div></dl>
          <section class="rating" aria-labelledby="r-title">
            <div class="rating-main"><span class="stamp score num" aria-hidden="true">${K.score(it.avg)}</span>
              <div><h2 id="r-title" style="font-size:1.15rem">Nota de la comunidad</h2><p class="muted"><span class="sr-only">${K.score(it.avg)} sobre 10, </span>${K.votesLabel(it.votes)}</p></div></div>
            <ul class="bars" aria-label="Distribución de los votos">${bars}</ul>
          </section>
          <div class="actions">
            <a class="btn cat" href="#" data-go="votar">${icon('check')}Votar</a>
            <button class="btn secondary" type="button">${icon('listplus')}Añadir a lista</button>
            <button class="btn secondary" type="button" aria-pressed="false" id="wishBtn">${icon('bookmark')}Wishlist</button>
          </div>
          <section class="prose" aria-labelledby="about"><h2 id="about">Acerca de</h2>${D.about.map((p) => `<p>${p}</p>`).join('')}<p class="source">Texto: ${D.aboutSource}.</p></section>
        </div>
      </article>
      <section class="section" aria-labelledby="c-title"><h2 id="c-title" style="margin-bottom:16px">Comentarios <span class="muted num">(${D.comments.length})</span></h2>
        <div class="comments">
          <form class="form" onsubmit="return false"><label for="comment">Tu comentario</label>
            <textarea id="comment" placeholder="¿Qué te ha parecido?" aria-describedby="comment-help"></textarea>
            <p id="comment-help" class="muted" style="font-size:.8125rem">Comentar suma kudos a tu pasaporte.</p>
            <button class="btn" type="submit">Publicar</button></form>
          <div>${comments}</div>
        </div></section>
      <section class="section" aria-labelledby="sim-title"><div class="sec-head"><h2 id="sim-title">Similares</h2>${arrows(sim.id, 'Similares')}</div>${sim.html}</section>
      <p class="credit">Datos e imagen de TMDB.</p>
    </div>`;
    $('#wishBtn').addEventListener('click', (e) => {
      const b = e.currentTarget; b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
    });
  }

  // --- Votar ---
  const V = { step: 'know', left: K.vote.queueLeft, last: '', focus: false };
  function renderVoteShell() {
    const it = K.byId[K.vote.id];
    const cat = K.categories[it.cat];
    $('#screenVotar').innerHTML = `<div class="vote c-${it.cat}">
      <figure class="poster" style="margin:0"><img src="${K.art(it)}" alt="Póster de ${it.name} (ilustración de la maqueta)" width="400" height="600"></figure>
      <div>
        <div class="progress"><span><b class="num" id="left">${V.left}</b> por votar en ${cat.label.toLowerCase()}</span><span class="kudos-badge">${icon('star')}<span id="vk">${K.user.kudosLabel}</span></span>
          <span class="track" aria-hidden="true"><span></span></span></div>
        <span class="kicker" style="margin-top:18px">${icon(catIcon[it.cat])}${cat.short} · ${it.year}</span>
        <h1>${it.name}</h1>
        <p class="syn">${K.vote.synopsis}</p>
        <section class="vote-card" aria-live="polite" aria-label="Tu voto" id="voteCard" tabindex="-1"></section>
        <p class="earn muted">${icon('star')}Cada voto suma kudos a tu pasaporte y te acerca al podio de la liga.</p>
      </div></div>`;
    renderStep();
  }
  function renderStep() {
    const card = $('#voteCard');
    if (!card) return;
    const back = `<button class="btn secondary back" type="button" data-v="back">${icon('back')}Volver <kbd>Esc</kbd></button>`;
    if (V.step === 'know') {
      card.innerHTML = `<h2 id="vq">¿Lo conoces?</h2><p class="hint">Dinos si la has visto para valorarla o guardarla.</p>
        <div class="choices"><button class="btn secondary" type="button" data-v="no">No <kbd>N</kbd></button><button class="btn cat" type="button" data-v="yes">Sí <kbd>S</kbd></button></div>`;
    } else if (V.step === 'score') {
      card.innerHTML = `<h2>¿Qué te ha parecido?</h2>
        <div class="levels">${K.vote.levels.slice().reverse().map((l) => `<button class="btn secondary" type="button" data-v="rate" data-score="${l.score}">${l.label} <kbd>${l.key}</kbd></button>`).join('')}</div>${back}`;
    } else if (V.step === 'interest') {
      card.innerHTML = `<h2>¿Te interesa?</h2><p class="hint">Si te interesa, la guardamos en tu wishlist.</p>
        <div class="choices"><button class="btn cat" type="button" data-v="want">${icon('bookmark')}Me interesa <kbd>1</kbd></button>
        <button class="btn secondary" type="button" data-v="skip">${icon('eyeoff')}No me interesa <kbd>2</kbd></button></div>${back}`;
    } else {
      card.innerHTML = `<div class="done"><span class="stamp big-stamp drop"><span><b>+2</b><small>kudos</small></span></span>
        <h2>¡Hecho!</h2><p class="hint">${V.last}. Vamos con el siguiente.</p></div>`;
    }
    // Si el foco estaba en la tarjeta, se queda en ella al cambiar de paso.
    if (V.focus) (V.step === 'done' ? card : card.querySelector('button'))?.focus();
  }
  function act(a, score) {
    if (V.step === 'done') return;
    V.focus = !!document.activeElement?.closest('#voteCard');
    if (a === 'yes') V.step = 'score';
    else if (a === 'no') V.step = 'interest';
    else if (a === 'back') V.step = 'know';
    else {
      V.last = a === 'rate' ? `Votado: ${K.vote.levels.find((l) => l.score === score).label}` : a === 'want' ? 'Guardada en tu wishlist' : 'No te la volveremos a proponer';
      V.step = 'done';
      V.left = Math.max(0, V.left - 1);
      $('#left').textContent = V.left;
      setTimeout(() => { V.step = 'know'; renderStep(); }, 1600);
      V.focus = V.focus || document.activeElement === document.body;
    }
    renderStep();
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]');
    if (b) act(b.dataset.v, Number(b.dataset.score));
    const s = e.target.closest('[data-scroll]');
    if (s) { const r = document.getElementById(s.dataset.target); r.scrollBy({ left: Number(s.dataset.scroll) * r.clientWidth * 0.8, behavior: 'smooth' }); }
    if (e.target.closest('[data-nop]')) e.preventDefault();
  });
  document.addEventListener('keydown', (e) => {
    if (window.Mockup?.screen !== 'votar' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('input, textarea')) return;
    const k = e.key.toLowerCase();
    if (V.step === 'know') { if (k === 's') act('yes'); if (k === 'n') act('no'); }
    else if (V.step === 'score') {
      const l = K.vote.levels.find((x) => x.key === k);
      if (l) act('rate', l.score);
      if (k === 'escape') act('back');
    } else if (V.step === 'interest') {
      if (k === '1') act('want'); if (k === '2') act('skip'); if (k === 'escape') act('back');
    }
  });
  document.addEventListener('mockup:screen', (e) => { if (e.detail === 'votar') { V.step = 'know'; renderStep(); } });

  // --- Pie ---
  function renderFooter() {
    const F = K.footer;
    $('#footer').innerHTML = `<div class="foot-grid">
        <div><a class="logo" href="#" data-go="home" style="font-size:1.15rem"><span style="display:inline-flex;width:28px">${logo}</span>${F.brand}</a>
          <p class="muted" style="margin-top:6px;font-size:.875rem">${F.author}</p>
          <p class="links"><a href="#" data-nop>Privacidad</a><a href="#" data-nop>Aviso legal</a></p></div>
        <div class="center"><b>${F.school}</b><p class="muted">${F.schoolSub}</p></div>
        <a class="gh" href="#" data-nop>${icon('github')}GitHub</a>
      </div>
      <div class="attr"><span class="tmdb" aria-label="TMDB">TMDB</span><p>${F.tmdb}</p><p class="igdb">${F.igdb.replace('IGDB.com', '<strong>IGDB.com</strong>')}</p></div>`;
  }

  renderHeader();
  disclosure($('#menuBtn'), $('#mobileMenu'), (open) => {
    $('#menuBtn').innerHTML = icon(open ? 'x' : 'menu');
    $('#menuBtn').setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
  });
  disclosure($('#userBtn'), $('#userMenu'));
  renderHome();
  renderFicha();
  renderVoteShell();
  renderFooter();
})();
</script>
</body>
</html>
