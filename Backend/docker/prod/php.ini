; Ajustes de producción de Kudos. Se cargan después de php.ini-production y solo cambian lo necesario.

; No anunciar la versión de PHP en la cabecera X-Powered-By.
expose_php = Off

; Procesar imágenes con GD (Intervention) necesita memoria: una foto de 12 MP son ~48 MB de mapa de bits
; sin comprimir, y redimensionar y generar variantes lo multiplica. Con 256M fallaba el seeder.
; El límite sigue protegiendo al servidor: una imagen desproporcionada aborta esa petición, no el VPS.
memory_limit = 512M

; Una imagen por petición, de 5 MB como máximo (config/media.php), más margen para el resto del formulario.
; Nginx (interno y del host) tiene client_max_body_size 10M, acorde con post_max_size.
upload_max_filesize = 8M
post_max_size = 10M

; OPcache: el código no cambia dentro de la imagen, así que no hace falta comprobar si los ficheros
; han cambiado en cada petición (validate_timestamps = 0). Un despliegue crea contenedores nuevos.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
