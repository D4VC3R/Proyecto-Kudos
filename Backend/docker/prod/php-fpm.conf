; Pool de PHP-FPM para Kudos. Se carga después de docker.conf/www.conf de la imagen oficial
; (que ya fijan listen = 9000, logs a stderr y clear_env = no) y sobrescribe solo lo necesario.
[www]
; ondemand: los procesos se crean al llegar peticiones y se cierran tras 10 s sin trabajo.
; En un VPS compartido con poco tráfico, no hay procesos ocupando RAM mientras nadie usa la demo.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
; Reciclar cada proceso tras 500 peticiones evita que una fuga de memoria crezca sin límite.
pm.max_requests = 500

; Las variables de entorno (env_file) deben llegar a PHP. La imagen ya lo hace; se deja explícito.
clear_env = no

; El log de accesos ya lo escribe Nginx; aquí solo duplicaría líneas.
access.log = /dev/null
