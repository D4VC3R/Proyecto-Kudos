# Nginx INTERNO de Kudos: solo lo alcanza el Nginx del host a través de 127.0.0.1:8001.
# TLS, cabeceras de seguridad y X-Forwarded-* los gestiona el Nginx del host (deploy/nginx/).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;
    # Acorde con post_max_size de PHP (docker/prod/php.ini).
    client_max_body_size 10M;

    # DNS interno de Docker. Con un nombre fijo en fastcgi_pass, Nginx resuelve "app" UNA vez al
    # arrancar; al desplegar, Docker recrea "app" con otra IP y Nginx seguiría apuntando a la vieja
    # (502 hasta reiniciarlo). Con una variable, resuelve en cada petición (caché de 10 s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    # Nunca servir ficheros ocultos (.env, .git...). 404 para no confirmar que existen.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Imágenes subidas: public/storage es un enlace al volumen compartido con PHP.
    # Los nombres de fichero son únicos, así que el navegador puede cachearlas mucho tiempo.
    location /storage/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo se ejecuta el front controller de Laravel; cualquier otro .php devuelve 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        return 404;
    }
}
